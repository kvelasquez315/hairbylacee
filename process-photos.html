<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salon Photo Processor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f7f4f1;
      color: #2c2825;
      padding: 2rem;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.3rem; }
    .subtitle { color: #7a6c63; margin-bottom: 2rem; font-size: 0.95rem; }

    #dl-all {
      display: none;
      margin-bottom: 2rem;
      background: #a0665a;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.9rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    #dl-all:hover { background: #8a5149; }
    #progress {
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: #7a6c63;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .slot {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(44,40,37,0.08);
    }

    .slot-header {
      padding: 0.7rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 1px solid #f0ebe7;
    }
    .slot-num {
      background: #f0ebe7;
      color: #7a6c63;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .slot-num.done { background: #2c2825; color: white; }
    .slot-label { font-size: 0.85rem; font-weight: 600; flex: 1; }
    .slot-badge {
      font-size: 0.7rem;
      color: #7a6c63;
      background: #f7f4f1;
      padding: 2px 7px;
      border-radius: 20px;
    }

    .slot-drop {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      cursor: pointer;
      border: 2px dashed #e0d6d0;
      border-radius: 0;
      transition: background 0.15s, border-color 0.15s;
      padding: 1rem;
      text-align: center;
      color: #b5a49b;
      font-size: 0.85rem;
    }
    .slot-drop:hover, .slot-drop.over {
      background: #fdf0eb;
      border-color: #c4a89a;
      color: #a0665a;
    }
    .slot-drop .icon { font-size: 1.6rem; }
    .slot-drop input { display: none; }

    .slot-preview {
      display: none;
      position: relative;
      background: #1a1410;
    }
    .slot-preview canvas {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .slot-preview .reuse-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.55);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .slot-preview .reuse-btn:hover { background: rgba(160,102,90,0.85); }

    .slot-footer {
      padding: 0.7rem 1rem;
      border-top: 1px solid #f0ebe7;
    }
    .btn-dl {
      width: 100%;
      background: #2c2825;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-dl:hover { background: #a0665a; }
    .btn-dl:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

<h1>Salon Photo Processor</h1>
<p class="subtitle">Drop each photo into its labeled slot — order is locked in</p>

<p id="progress">0 / 12 photos added</p>
<button id="dl-all">⬇ Download All</button>
<div class="slots" id="slots"></div>

<script>
const CROPS = {
  1:  [0.50, 0.03, 1.00, 0.97],
  2:  [0.47, 0.03, 1.00, 0.97],
  3:  [0.02, 0.03, 0.56, 0.97],
  4:  [0.03, 0.04, 0.97, 0.97],
  5:  [0.50, 0.03, 1.00, 0.97],
  6:  [0.50, 0.04, 1.00, 0.97],
  7:  [0.32, 0.03, 0.90, 0.97],
  8:  [0.44, 0.03, 1.00, 0.97],
  9:  [0.03, 0.05, 0.97, 0.97],
  10: [0.47, 0.03, 1.00, 0.97],
  11: [0.04, 0.02, 0.96, 0.97],
  12: [0.03, 0.02, 0.97, 0.97],
};

const ENHANCE = {
  1:  { brightness: 1.08, contrast: 1.22, saturate: 1.15 },
  2:  { brightness: 1.10, contrast: 1.20, saturate: 1.20 },
  3:  { brightness: 1.12, contrast: 1.18, saturate: 1.18 },
  4:  { brightness: 1.08, contrast: 1.25, saturate: 1.15 },
  5:  { brightness: 1.06, contrast: 1.28, saturate: 1.20 },
  6:  { brightness: 1.10, contrast: 1.20, saturate: 1.10 },
  7:  { brightness: 1.08, contrast: 1.22, saturate: 1.18 },
  8:  { brightness: 1.12, contrast: 1.18, saturate: 1.22 },
  9:  { brightness: 1.10, contrast: 1.18, saturate: 1.25 },
  10: { brightness: 1.08, contrast: 1.25, saturate: 1.15 },
  11: { brightness: 1.06, contrast: 1.14, saturate: 1.12 },
  12: { brightness: 1.06, contrast: 1.14, saturate: 1.12 },
};

const OUTPUT_NAMES = {
  11: 'lacee1.jpg',
  12: 'lacee2.jpg',
};

const LABELS = [
  null,
  'Ash-blonde texture',
  'Brunette balayage',
  'Blonde, flower wall',
  'Dark waves full shot',
  'Reddish-brown after',
  'Silver/ash from behind',
  'Long dark curly',
  'Blonde wavy, sage jacket',
  'Pink highlights',
  'Dark brunette waves',
  'Lacee — chair portrait',
  'Lacee — with flowers',
];

const TARGET_W = 800;
const TARGET_H = 1066;

const processedCanvases = {};
const slotsEl = document.getElementById('slots');
const dlAll   = document.getElementById('dl-all');
const progress = document.getElementById('progress');

function updateProgress() {
  const done = Object.keys(processedCanvases).length;
  progress.textContent = `${done} / 12 photos added`;
  dlAll.style.display = done > 0 ? 'inline-block' : 'none';
}

// Build the 12 slots
for (let num = 1; num <= 12; num++) {
  const outName = OUTPUT_NAMES[num] || `photo${num}.jpg`;

  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.id = `slot-${num}`;
  slot.innerHTML = `
    <div class="slot-header">
      <div class="slot-num" id="num-${num}">${num}</div>
      <div class="slot-label">${LABELS[num]}</div>
      <div class="slot-badge" id="badge-${num}">empty</div>
    </div>
    <div class="slot-drop" id="drop-${num}">
      <div class="icon">+</div>
      <div>Drop photo here<br/>or click to choose</div>
      <input type="file" accept="image/*" id="input-${num}" />
    </div>
    <div class="slot-preview" id="preview-${num}">
      <canvas id="canvas-${num}"></canvas>
      <button class="reuse-btn" data-num="${num}">Replace</button>
    </div>
    <div class="slot-footer">
      <button class="btn-dl" id="dl-${num}" disabled>Download ${outName}</button>
    </div>
  `;
  slotsEl.appendChild(slot);

  const dropEl  = slot.querySelector(`#drop-${num}`);
  const inputEl = slot.querySelector(`#input-${num}`);

  dropEl.addEventListener('click', () => inputEl.click());
  dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('over'); });
  dropEl.addEventListener('dragleave', () => dropEl.classList.remove('over'));
  dropEl.addEventListener('drop', e => {
    e.preventDefault();
    dropEl.classList.remove('over');
    const file = e.dataTransfer.files[0];
    if (file) processFile(file, num);
  });
  inputEl.addEventListener('change', () => {
    if (inputEl.files[0]) processFile(inputEl.files[0], num);
  });

  slot.querySelector('.reuse-btn').addEventListener('click', () => {
    inputEl.click();
  });

  slot.querySelector(`#dl-${num}`).addEventListener('click', () => {
    if (processedCanvases[num]) downloadCanvas(processedCanvases[num], outName);
  });
}

function processFile(file, num) {
  document.getElementById(`badge-${num}`).textContent = 'processing…';
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => renderToCanvas(img, num);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderToCanvas(img, num) {
  const crop = CROPS[num];
  const enh  = ENHANCE[num];

  const iw = img.naturalWidth;
  const ih = img.naturalHeight;

  const sx = Math.floor(iw * crop[0]);
  const sy = Math.floor(ih * crop[1]);
  const sw = Math.floor(iw * (crop[2] - crop[0]));
  const sh = Math.floor(ih * (crop[3] - crop[1]));

  const scale = Math.max(TARGET_W / sw, TARGET_H / sh);
  const drawW = Math.round(sw * scale);
  const drawH = Math.round(sh * scale);
  const offX  = Math.round((drawW - TARGET_W) / 2);
  const offY  = Math.round((drawH - TARGET_H) / 2);

  const off = document.createElement('canvas');
  off.width  = TARGET_W;
  off.height = TARGET_H;
  const ctx = off.getContext('2d');
  ctx.filter = `brightness(${enh.brightness}) contrast(${enh.contrast}) saturate(${enh.saturate})`;
  ctx.drawImage(img, sx, sy, sw, sh, -offX, -offY, drawW, drawH);

  const canvas = document.getElementById(`canvas-${num}`);
  canvas.width  = TARGET_W;
  canvas.height = TARGET_H;
  canvas.getContext('2d').drawImage(off, 0, 0);

  processedCanvases[num] = off;

  document.getElementById(`drop-${num}`).style.display   = 'none';
  document.getElementById(`preview-${num}`).style.display = 'block';
  document.getElementById(`badge-${num}`).textContent = `${TARGET_W}×${TARGET_H}`;
  document.getElementById(`num-${num}`).classList.add('done');

  const dlBtn = document.getElementById(`dl-${num}`);
  dlBtn.disabled = false;

  updateProgress();
}

function downloadCanvas(canvas, filename) {
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/jpeg', 0.92);
}

dlAll.addEventListener('click', async () => {
  const nums = Object.keys(processedCanvases).map(Number).sort((a, b) => a - b);
  for (const num of nums) {
    const outName = OUTPUT_NAMES[num] || `photo${num}.jpg`;
    downloadCanvas(processedCanvases[num], outName);
    await new Promise(r => setTimeout(r, 220));
  }
});
</script>
</body>
</html>
